<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Simulator</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="header">
        <h1>Rock, Paper, Scissors</h1>
    </div>
    <div class="bot">
        <p id="opponent">Choose Your Weapon:</p>
    </div>
    <div id="bot-choice" class="bot-choice">
    </div>
    <div class="choices">
        <button class="rock" onClick="rock()">Rock</button>
        <button class="paper" onClick="paper()">Paper</button>
        <button class="scissors" onClick="scissors()">Scissors</button>
    </div>
    <div class="winner">
        <p id="player_choice"></p>
        <p id="winner">Do you really think you can beat me?</p>
    </div>
    <script src="logic.js"></script>
</body>
</html>
